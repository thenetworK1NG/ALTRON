          pointer.dx = (touches[i].pageX - pointer.x) * 10.0;
          pointer.dy = (touches[i].pageY - pointer.y) * 10.0;
          pointer.x = touches[i].pageX;
          pointer.y = touches[i].pageY;
      }
  }, false);

  canvas.addEventListener('touchend', function () {
      for (var i = 0; i < pointers.length; i++) pointers[i].down = false;
  });

  var ambientColors = [
      [0.15, 0.85, 0.25],
      [0.2, 0.9, 0.2],
      [0.1, 0.8, 0.3]
  ];
  var ambientIndex = 0;

  function ambientSmoke() {
      var c = ambientColors[ambientIndex % ambientColors.length];
      ambientIndex++;
      var x = canvas.width * (0.2 + Math.random() * 0.6);
      var y = canvas.height * (0.2 + Math.random() * 0.6);
      var force = isMobile ? 50 : 100;
      var dx = force * (Math.random() - 0.5);
      var dy = force * (Math.random() - 0.5);
      splat(x, y, dx, dy, c);
      var delay = isMobile ? 3000 + Math.random() * 3000 : 2000 + Math.random() * 2000;
      setTimeout(ambientSmoke, delay);
  }
  ambientSmoke();

  window.addEventListener('orientationchange', function () {
      setTimeout(function () {
          canvas.width = canvas.clientWidth;
          canvas.height = canvas.clientHeight;
          initFramebuffers();
      }, 200);
  });
  </script>
</body>
</html>
